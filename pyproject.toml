[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aorpisc"
version = "0.1.0"
description = "Open-source Area of Review (AoR) and Post-Injection Site Care (PISC) toolkit for UIC Class VI geologic carbon storage"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Seyed Mahjour" }]
keywords = [
    "carbon storage", "CCS", "Class VI", "UIC", "area of review", "AoR",
    "post-injection site care", "PISC", "CO2", "geologic sequestration",
    "reservoir simulation", "vertical equilibrium",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    # CoolProp supplies the Span-Wagner reference EOS for CO2. The package
    # falls back to a built-in cubic EOS if it is unavailable, but that
    # fallback is unreliable near the critical point, so it is a base
    # dependency rather than an extra.
    "CoolProp>=6.5",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18", "pandas>=2.0"]
gis = ["pyproj>=3.5", "folium>=0.15"]
full = ["streamlit>=1.30", "plotly>=5.18", "pandas>=2.0", "pyproj>=3.5",
        "folium>=0.15"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/Kouroshie/aor-pisc-toolkit"
Repository = "https://github.com/Kouroshie/aor-pisc-toolkit"
Issues = "https://github.com/Kouroshie/aor-pisc-toolkit/issues"
Documentation = "https://github.com/Kouroshie/aor-pisc-toolkit/tree/main/docs"

[project.scripts]
aorpisc = "aorpisc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer end-to-end runs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
